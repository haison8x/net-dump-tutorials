name: Build labs and images

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "mkdocs.yml", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build labs/DumpLabs.slnx -warnaserror
      - run: dotnet build tools/DumpAnalyzer -warnaserror

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dumps && chmod a+rwx dumps   # the apps run as UID 1654
      - run: docker compose --profile manual build
      # Smoke test: start the APIs and collect a dump from inside a container.
      - run: docker compose up -d memoryleak deadlock
      - run: |
          for i in $(seq 1 30); do curl -sf http://localhost:5100/stats && break; sleep 1; done
          curl -sf http://localhost:5200/health
      - run: docker compose exec -T memoryleak dotnet-dump collect -p 1 --type Heap -o /dumps/ci.dmp
      - run: docker compose run --rm -T tools dotnet-dump analyze /dumps/ci.dmp -c "dumpheap -stat" -c exit
      - run: docker compose run --rm -T tools dumpanalyzer stat /dumps/ci.dmp 5
      - if: always()
        run: docker compose down
