# Custom profile for `kubectl debug` (kubectl >= 1.31):
#
#   kubectl debug -it <pod> --image=dumplab/tools --target=memoryleak \
#       --custom=k8s/debug-profile.yaml -- sh
#
# - runAsUser: the debug container must run as the SAME user as the app,
#   otherwise the runtime refuses the diagnostic connection.
# - TMPDIR: the app's diagnostic socket lives in the app container's /tmp.
#   With --target the debug container shares the app's PID namespace, so the
#   app's filesystem is reachable through /proc/1/root.
securityContext:
  runAsUser: 1654
  runAsNonRoot: true
env:
  - name: TMPDIR
    value: /proc/1/root/tmp
  - name: HOME
    value: /tmp
