# MemoryLeak.Api on Kubernetes, ready for dump collection.
# See docs/08-linux-docker-k8s.md.
#
#   docker compose build memoryleak
#   kind load docker-image dumplab/memoryleak     # or: minikube image load dumplab/memoryleak
#   kubectl apply -f k8s/memoryleak.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryleak
spec:
  replicas: 1
  selector:
    matchLabels: { app: memoryleak }
  template:
    metadata:
      labels: { app: memoryleak }
    spec:
      securityContext:
        runAsUser: 1654          # $APP_UID of the .NET images
        runAsNonRoot: true
        fsGroup: 1654            # makes the /dumps volume writable for the app
      containers:
        - name: memoryleak
          image: dumplab/memoryleak
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Dump automatically on crash (docs/02-collecting-dumps.md)
            - { name: DOTNET_DbgEnableMiniDump, value: "1" }
            - { name: DOTNET_DbgMiniDumpType, value: "2" }     # Heap: smaller than Full, enough for managed analysis
            - { name: DOTNET_DbgMiniDumpName, value: "/dumps/crash_%e_%p_%t.dmp" }
            - { name: DOTNET_EnableCrashReport, value: "1" }
          resources:
            limits:
              memory: 512Mi      # a leak eventually gets the pod OOMKilled - collect a dump BEFORE that
          volumeMounts:
            - { name: dumps, mountPath: /dumps }
      volumes:
        # emptyDir survives container restarts (e.g. after a crash) but not pod deletion.
        # Use a PersistentVolumeClaim if dumps must outlive the pod.
        - name: dumps
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: memoryleak
spec:
  selector: { app: memoryleak }
  ports:
    - port: 8080
      targetPort: 8080
